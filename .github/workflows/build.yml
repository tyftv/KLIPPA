name: Build KLIPPA
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit test DSP
        shell: bash
        run: |
          g++ -std=c++17 -O2 tests/dsp_test.cpp -o dsp_test.exe && ./dsp_test.exe
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target KLIPPA_VST3 --parallel
      - name: Package
        shell: bash
        run: |
          mkdir out
          cp -r build/KLIPPA_artefacts/Release/VST3/KLIPPA.vst3 out/
      - uses: actions/upload-artifact@v4
        with:
          name: KLIPPA-VST3-windows
          path: out
